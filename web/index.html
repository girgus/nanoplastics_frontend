<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Nanoplastic pollution solutions platform. Explore impacts, submit ideas, and climb the solver leaderboard.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NanoSolve">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>NanoSolve Hive</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.js" type="text/javascript"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.worker.min.js";
    pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/cmaps/',
      cMapPacked: true,
    }
  </script>
  <script type="text/javascript">
    // Firefox privacy / network policies can block CanvasKit from gstatic.
    // Force HTML renderer only on Firefox.
    const userAgent = navigator.userAgent || '';
    const isFirefox = /firefox/i.test(userAgent);
    if (isFirefox) {
      window.flutterWebRenderer = 'html';
    }
  </script>
  <!--
    Cloudflare Turnstile bot defense.
    Loaded once; widget mounts lazily on first requestToken() call.
    Site key is public (safe to expose); secret key lives only on the backend.
  -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <div id="ns-turnstile-container"
    style="position:fixed;bottom:12px;right:12px;z-index:2147483647;"></div>
  <script type="text/javascript">
    (function () {
      var SITE_KEY = '0x4AAAAAAC_0IH-cS-iLRru3';
      var widgetId = null;
      var pending = null; // { resolve, reject }

      function ready(cb) {
        if (window.turnstile) return cb();
        var t = setInterval(function () {
          if (window.turnstile) { clearInterval(t); cb(); }
        }, 50);
      }

      function settle(token, error) {
        if (!pending) return;
        var p = pending; pending = null;
        if (error) p.reject(new Error(error));
        else p.resolve(token);
      }

      window.nanosolveTurnstile = {
        requestToken: function () {
          return new Promise(function (resolve, reject) {
            if (pending) {
              return reject(new Error('Turnstile request already in flight'));
            }
            pending = { resolve: resolve, reject: reject };

            ready(function () {
              try {
                if (widgetId === null) {
                  widgetId = window.turnstile.render('#ns-turnstile-container', {
                    sitekey: SITE_KEY,
                    size: 'flexible',
                    callback: function (token) { settle(token, null); },
                    'error-callback': function () { settle(null, 'turnstile-error'); },
                    'expired-callback': function () { window.turnstile.reset(widgetId); },
                    'timeout-callback': function () { settle(null, 'turnstile-timeout'); },
                  });
                } else {
                  window.turnstile.reset(widgetId);
                }
              } catch (e) {
                settle(null, String(e));
              }
            });
          });
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
